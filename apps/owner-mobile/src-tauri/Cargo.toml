[package]
name = "handsfree-owner"
version = "1.0.0"
description = "HandsFree Owner - Restaurant analytics and management"
authors = ["StonePot Tech"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "handsfree_owner_lib"
crate-type = ["staticlib", "cdylib", "lib"]
