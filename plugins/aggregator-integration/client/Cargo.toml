[package]
name = "aggregator-integration-client"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
regex = "1.10"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]
