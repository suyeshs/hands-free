[package]
name = "whatsapp-business-client"
version = "1.0.0"
edition = "2021"
authors = ["HandsFree POS Team"]
description = "WhatsApp Business client plugin for POS UI"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlButtonElement",
    "HtmlTextAreaElement",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Crypto",
    "SubtleCrypto",
    "CryptoKey",
    "AesGcmParams",
] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package."*"]
opt-level = "z"
