[package]
name = "subscription-meals-wasm"
version = "1.0.0"
edition = "2021"
description = "Subscription Meals Plugin - WASM Bindings"
authors = ["Guanix Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

[dependencies.web-sys]
version = "0.3"
features = [
  'console',
  'Window',
  'Document',
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
