name: Build Migration Tool - Windows x64

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/coorg-migration-tool/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/coorg-migration-tool/**'
  workflow_dispatch:

jobs:
  build-windows-x64:
    name: Build Windows x64 NSIS
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/coorg-migration-tool/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/coorg-migration-tool/src-tauri

      - name: Install frontend dependencies
        working-directory: apps/coorg-migration-tool
        run: npm install

      - name: Build Tauri app
        working-directory: apps/coorg-migration-tool
        run: npm run tauri build

      - name: Upload Windows x64 NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: coorg-migration-tool-windows-x64-nsis
          path: apps/coorg-migration-tool/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
