#:schema node_modules/wrangler/config-schema.json
name = "geolocation-service"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Worker configuration
workers_dev = true
route = ""
zone_id = ""

# Custom domain (update after deployment)
# routes = [
#   { pattern = "geo.handsfree.tech", custom_domain = true }
# ]

[env.production]
name = "geolocation-service"
workers_dev = false
# Add your custom domain here after setting up DNS
# routes = [
#   { pattern = "geo.handsfree.tech", custom_domain = true }
# ]

[env.staging]
name = "geolocation-service-staging"
workers_dev = true
