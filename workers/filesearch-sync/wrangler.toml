name = "filesearch-sync-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Account ID
account_id = "0f3287b287060e3215662501ee96292e"

# Environment variables
[vars]
GCP_PROJECT_ID = "sahamati-labs"
GCP_LOCATION = "global"

# Secrets (set via: wrangler secret put GOOGLE_CLOUD_CREDENTIALS)
# GOOGLE_CLOUD_CREDENTIALS = "..." (JSON service account key)

# Routes
routes = [
  { pattern = "filesearch-sync.handsfree.tech/*", zone_name = "handsfree.tech" }
]

# Worker limits
workers_dev = true
node_compat = true

# Observability
[observability]
enabled = true
