# Plugin Registry Worker
# Manages plugin metadata, WASM files, and registry API

name = "handsfree-plugin-registry"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# R2 bucket for plugin storage (requires R2 to be enabled in Cloudflare dashboard)
# [[r2_buckets]]
# binding = "PLUGIN_STORAGE"
# bucket_name = "handsfree-plugins"
# preview_bucket_name = "handsfree-plugins-preview"

# KV namespace for plugin metadata
[[kv_namespaces]]
binding = "PLUGIN_METADATA"
id = "09d5d3299ad5435f9226fc23ef9ad164"
preview_id = "edafa90eda7c46d5acf56b1ea846e57c"

# Environment variables
[vars]
ENVIRONMENT = "production"
REGISTRY_URL = "https://plugins.handsfree.tech"

# CORS configuration
[env.production.vars]
ALLOWED_ORIGINS = "*"

[env.preview.vars]
ALLOWED_ORIGINS = "*"

[env.development.vars]
ALLOWED_ORIGINS = "*"
