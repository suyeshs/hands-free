[package]
name = "restaurant-pos-ai"
version = "3.1.7"
description = "Complete Restaurant Operating System"
authors = ["you"]
edition = "2021"
default-run = "restaurant-pos-ai"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Translation utility binaries (temporarily disabled for tauri dev)
# [[bin]]
# name = "translate_generator"
# path = "src/bin/translate_generator.rs"

# [[bin]]
# name = "export_translations_json"
# path = "src/bin/export_translations_json.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"

# Authentication & Security
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["rand_core"] }
rand = "0.8"
ring = "0.17"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"

# Google Cloud Authentication (for Gemini Live / Vertex AI)
gcp_auth = "0.12"
http = "1.0"

# LAN Sync (POS ↔ KDS/BDS)
mdns-sd = "0.11"
tokio-tungstenite = "0.24"
futures-util = "0.3"
local-ip-address = "0.6"
once_cell = "1.19"
hostname = "0.4"
lazy_static = "1.4"
base64 = "0.22.1"

# Local Web Server for QR Code Ordering
actix-web = "4.9"
actix-cors = "0.7"
actix-web-actors = "4.3"
actix = "0.13"
actix-governor = "0.5"
urlencoding = "2.1"

# Desktop-only dependencies (keyring not supported on Android)
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "2.3"
tauri-plugin-updater = "2"

# Windows-only: Win32 Print Spooler API for reliable raw thermal printing
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Printing",
] }

# Android-only dependencies
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Security: String encryption for sensitive data
[dependencies.obfstr]
version = "0.4"

# Security: AES-GCM encryption for configs
[dependencies.aes-gcm]
version = "0.10"

# Security: SQLCipher encrypted database (macOS and Linux only - requires OpenSSL)
# Used for encrypting sensitive data at rest
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies.rusqlite]
version = "0.31"
features = ["bundled-sqlcipher"]

# For Windows and Android, use regular bundled SQLite (no OpenSSL dependency)
[target.'cfg(any(target_os = "windows", target_os = "android"))'.dependencies.rusqlite]
version = "0.31"
features = ["bundled"]

# Development profile optimizations for faster builds and lower memory usage
[profile.dev]
opt-level = 1           # Minimal optimization for faster compile times
debug = 1               # Limited debug info (less memory)
incremental = true      # Enable incremental compilation
split-debuginfo = "unpacked"  # Faster debug info generation

[profile.dev.build-override]
opt-level = 0           # No optimization for build scripts
debug = false           # No debug info for build scripts

[profile.dev.package."*"]
opt-level = 1           # Optimize dependencies slightly for better runtime performance
debug = false           # No debug info for dependencies (saves memory)

# Release profile optimizations for security
[profile.release]
opt-level = 3           # Maximum optimization
lto = "fat"             # Full link-time optimization (better dead code elimination)
codegen-units = 1       # Single codegen unit for better optimization
panic = "abort"         # Abort on panic (smaller binary, no unwind info for attackers)
strip = "symbols"       # Strip debug symbols
debug = false           # No debug info

[profile.release.build-override]
opt-level = 3

