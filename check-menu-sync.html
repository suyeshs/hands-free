<!DOCTYPE html>
<html>
<head>
  <title>Check Menu Sync Status</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1a1a1a;
      color: #00ff00;
    }
    .section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #333;
      background: #0a0a0a;
    }
    .success { color: #00ff00; }
    .error { color: #ff0000; }
    .warning { color: #ffaa00; }
    .info { color: #00aaff; }
    button {
      background: #00ff00;
      color: #000;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-family: monospace;
      font-weight: bold;
      margin: 5px;
    }
    button:hover { background: #00cc00; }
    pre {
      background: #000;
      padding: 10px;
      overflow-x: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 10px 0;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px;
      text-align: left;
    }
    th { background: #222; }
  </style>
</head>
<body>

<h1>🔍 Menu Sync Diagnostic</h1>

<div class="section">
  <h2>Local Database (SQLite)</h2>
  <button onclick="checkLocalMenu()">Check Local Menu</button>
  <button onclick="checkD1DatabaseId()">Check D1 Database ID</button>
  <div id="localResults"></div>
</div>

<div class="section">
  <h2>Cloud Database (D1)</h2>
  <button onclick="checkCloudMenu()">Check Cloud Menu</button>
  <button onclick="checkMenuCategories()">Check Categories</button>
  <div id="cloudResults"></div>
</div>

<div class="section">
  <h2>Sync Actions</h2>
  <button onclick="syncFromBackend()">Sync from Backend API</button>
  <button onclick="syncToD1()">Sync to D1 (Upload)</button>
  <button onclick="compareMenus()">Compare Local vs Cloud</button>
  <div id="syncResults"></div>
</div>

<script>
// Check local SQLite database
async function checkLocalMenu() {
  const output = document.getElementById('localResults');
  output.innerHTML = '<p class="info">Checking local database...</p>';

  try {
    const Database = window.__TAURI__?.sql;
    if (!Database) {
      output.innerHTML = '<p class="error">❌ Tauri SQL not available (not running in Tauri app)</p>';
      return;
    }

    const db = await Database.load('sqlite:pos.db');

    // Count menu items
    const items = await db.select('SELECT COUNT(*) as count FROM menu_items');
    const itemCount = items[0]?.count || 0;

    // Count categories
    const cats = await db.select('SELECT COUNT(*) as count FROM menu_categories');
    const catCount = cats[0]?.count || 0;

    // Get sample items
    const sampleItems = await db.select('SELECT id, name, category_id, price, active FROM menu_items LIMIT 10');

    // Get tenant info
    const tenantInfo = localStorage.getItem('tenant-storage');
    let tenantId = 'unknown';
    let d1DatabaseId = null;

    if (tenantInfo) {
      const parsed = JSON.parse(tenantInfo);
      tenantId = parsed.state?.tenantId || 'unknown';
      d1DatabaseId = parsed.state?.d1DatabaseId || localStorage.getItem('d1_database_id');
    }

    let html = `
      <h3 class="success">✅ Local Database Connected</h3>
      <p><strong>Tenant ID:</strong> ${tenantId}</p>
      <p><strong>D1 Database ID:</strong> ${d1DatabaseId || 'Not configured'}</p>
      <p><strong>Menu Items:</strong> ${itemCount}</p>
      <p><strong>Categories:</strong> ${catCount}</p>
    `;

    if (sampleItems.length > 0) {
      html += '<h4>Sample Items (First 10):</h4><table>';
      html += '<tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Active</th></tr>';
      sampleItems.forEach(item => {
        html += `<tr>
          <td>${item.id}</td>
          <td>${item.name}</td>
          <td>${item.category_id}</td>
          <td>₹${item.price}</td>
          <td>${item.active ? '✅' : '❌'}</td>
        </tr>`;
      });
      html += '</table>';
    }

    output.innerHTML = html;
  } catch (error) {
    output.innerHTML = `<p class="error">❌ Error: ${error.message}</p><pre>${error.stack}</pre>`;
  }
}

// Check D1 database ID
async function checkD1DatabaseId() {
  const output = document.getElementById('localResults');

  const d1Id = localStorage.getItem('d1_database_id');
  const tenantStorage = localStorage.getItem('tenant-storage');

  let html = '<h3>D1 Database Configuration:</h3>';
  html += `<p><strong>localStorage d1_database_id:</strong> ${d1Id || 'Not set'}</p>`;

  if (tenantStorage) {
    try {
      const parsed = JSON.parse(tenantStorage);
      html += `<p><strong>Tenant Store d1DatabaseId:</strong> ${parsed.state?.d1DatabaseId || 'Not set'}</p>`;
      html += `<p><strong>Tenant ID:</strong> ${parsed.state?.tenantId || 'Not set'}</p>`;
      html += `<p><strong>Subdomain:</strong> ${parsed.state?.subdomain || 'Not set'}</p>`;
    } catch (e) {
      html += `<p class="error">Error parsing tenant storage: ${e.message}</p>`;
    }
  }

  output.innerHTML += html;
}

// Check cloud D1 menu
async function checkCloudMenu() {
  const output = document.getElementById('cloudResults');
  output.innerHTML = '<p class="info">Checking cloud database...</p>';

  try {
    const tenantStorage = localStorage.getItem('tenant-storage');
    if (!tenantStorage) {
      output.innerHTML = '<p class="error">❌ No tenant information found</p>';
      return;
    }

    const parsed = JSON.parse(tenantStorage);
    const tenantId = parsed.state?.tenantId;
    const subdomain = parsed.state?.subdomain;

    if (!tenantId) {
      output.innerHTML = '<p class="error">❌ No tenant ID found</p>';
      return;
    }

    // Call backend API to get menu
    const response = await fetch(`https://handsfree-restaurant-client.suyesh.workers.dev/api/menu/${tenantId}`);

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${await response.text()}`);
    }

    const data = await response.json();

    let html = `
      <h3 class="success">✅ Cloud Database Response</h3>
      <p><strong>Tenant ID:</strong> ${tenantId}</p>
      <p><strong>Subdomain:</strong> ${subdomain || 'Not set'}</p>
      <p><strong>Total Items:</strong> ${data.count || data.items?.length || 0}</p>
    `;

    if (data.items && data.items.length > 0) {
      html += '<h4>Sample Items (First 10):</h4><table>';
      html += '<tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Available</th></tr>';
      data.items.slice(0, 10).forEach(item => {
        html += `<tr>
          <td>${item.id}</td>
          <td>${item.name}</td>
          <td>${item.category}</td>
          <td>₹${item.price}</td>
          <td>${item.available ? '✅' : '❌'}</td>
        </tr>`;
      });
      html += '</table>';
    } else {
      html += '<p class="warning">⚠️  No menu items in cloud database</p>';
    }

    output.innerHTML = html;
  } catch (error) {
    output.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
  }
}

// Check menu categories
async function checkMenuCategories() {
  const output = document.getElementById('cloudResults');

  try {
    const Database = window.__TAURI__?.sql;
    if (!Database) {
      output.innerHTML += '<p class="error">❌ Tauri SQL not available</p>';
      return;
    }

    const db = await Database.load('sqlite:pos.db');
    const categories = await db.select('SELECT * FROM menu_categories ORDER BY sort_order');

    let html = '<h3>Local Categories:</h3><table>';
    html += '<tr><th>ID</th><th>Name</th><th>Sort Order</th><th>Active</th><th>Icon</th></tr>';
    categories.forEach(cat => {
      html += `<tr>
        <td>${cat.id}</td>
        <td>${cat.name}</td>
        <td>${cat.sort_order}</td>
        <td>${cat.active ? '✅' : '❌'}</td>
        <td>${cat.icon}</td>
      </tr>`;
    });
    html += '</table>';

    output.innerHTML += html;
  } catch (error) {
    output.innerHTML += `<p class="error">❌ Error: ${error.message}</p>`;
  }
}

// Sync from backend API
async function syncFromBackend() {
  const output = document.getElementById('syncResults');
  output.innerHTML = '<p class="info">Syncing from backend...</p>';

  try {
    const tenantStorage = localStorage.getItem('tenant-storage');
    if (!tenantStorage) {
      output.innerHTML = '<p class="error">❌ No tenant information</p>';
      return;
    }

    const parsed = JSON.parse(tenantStorage);
    const tenantId = parsed.state?.tenantId;

    // Import sync function
    const { syncMenuFromBackend } = await import('./src/lib/menuSync.ts');

    const result = await syncMenuFromBackend(tenantId);

    output.innerHTML = `
      <h3 class="success">✅ Sync Complete</h3>
      <p><strong>Items Synced:</strong> ${result.synced}</p>
      <p><strong>Categories Created:</strong> ${result.categoriesCreated}</p>
      <p><strong>Items Created:</strong> ${result.itemsCreated}</p>
    `;
  } catch (error) {
    output.innerHTML = `<p class="error">❌ Sync failed: ${error.message}</p>`;
  }
}

// Sync to D1
async function syncToD1() {
  const output = document.getElementById('syncResults');
  output.innerHTML = '<p class="info">Syncing to D1...</p>';

  try {
    const d1Id = localStorage.getItem('d1_database_id');
    if (!d1Id) {
      output.innerHTML = '<p class="error">❌ No D1 database ID configured</p>';
      return;
    }

    output.innerHTML = '<p class="warning">⚠️  D1 sync not yet implemented. Use Tauri sync commands.</p>';
  } catch (error) {
    output.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
  }
}

// Compare local vs cloud
async function compareMenus() {
  const output = document.getElementById('syncResults');
  output.innerHTML = '<p class="info">Comparing menus...</p>';

  try {
    // Get local count
    const Database = window.__TAURI__?.sql;
    const db = await Database.load('sqlite:pos.db');
    const localItems = await db.select('SELECT COUNT(*) as count FROM menu_items');
    const localCount = localItems[0]?.count || 0;

    // Get cloud count
    const tenantStorage = localStorage.getItem('tenant-storage');
    const parsed = JSON.parse(tenantStorage);
    const tenantId = parsed.state?.tenantId;

    const response = await fetch(`https://handsfree-restaurant-client.suyesh.workers.dev/api/menu/${tenantId}`);
    const data = await response.json();
    const cloudCount = data.count || data.items?.length || 0;

    const diff = Math.abs(localCount - cloudCount);
    const inSync = localCount === cloudCount;

    let html = `
      <h3>${inSync ? '✅ Menus In Sync' : '⚠️  Menus Out of Sync'}</h3>
      <table>
        <tr><th>Location</th><th>Count</th></tr>
        <tr><td>Local SQLite</td><td>${localCount}</td></tr>
        <tr><td>Cloud D1</td><td>${cloudCount}</td></tr>
        <tr><td>Difference</td><td class="${inSync ? 'success' : 'warning'}">${diff}</td></tr>
      </table>
    `;

    if (!inSync) {
      html += '<p class="warning">⚠️  Menus are out of sync. Use sync buttons above to synchronize.</p>';
    }

    output.innerHTML = html;
  } catch (error) {
    output.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
  }
}

// Auto-check on load
window.addEventListener('DOMContentLoaded', () => {
  console.log('Menu Sync Diagnostic loaded');
  console.log('Click buttons to check sync status');
});
</script>

</body>
</html>
