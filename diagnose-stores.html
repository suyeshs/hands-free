<!DOCTYPE html>
<html>
<head><title>Store Diagnostic</title></head>
<body style="font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0;">
<h1>🔍 Store Diagnostic</h1>
<button onclick="location.reload()" style="background: #0f0; color: #000; padding: 10px; border: none; cursor: pointer;">Refresh</button>
<pre id="output"></pre>
<script>
const output = document.getElementById('output');

function log(msg, type = 'info') {
    const colors = { success: '#0f0', error: '#f00', warn: '#ff0', info: '#0ff' };
    const span = document.createElement('span');
    span.style.color = colors[type];
    span.textContent = msg + '\n';
    output.appendChild(span);
}

// Check tenant store
log('=== TENANT STORE ===', 'info');
const tenantStorage = localStorage.getItem('tenant-storage');
if (tenantStorage) {
    const parsed = JSON.parse(tenantStorage);
    const tenantId = parsed?.state?.tenant?.tenantId;
    const isActivated = parsed?.state?.isActivated;

    log(`Tenant ID: ${tenantId || 'NOT FOUND'}`, tenantId ? 'success' : 'error');
    log(`Is Activated: ${isActivated}`, isActivated ? 'success' : 'warn');
    log(`Full tenant object:`, 'info');
    log(JSON.stringify(parsed.state?.tenant, null, 2), 'info');
} else {
    log('❌ NO TENANT STORAGE', 'error');
}

// Check auth store
log('\n=== AUTH STORE ===', 'info');
const authStorage = localStorage.getItem('auth-storage');
if (authStorage) {
    const parsed = JSON.parse(authStorage);
    const user = parsed?.state?.user;
    const userTenantId = user?.tenantId;

    log(`User Tenant ID: ${userTenantId || 'NOT FOUND'}`, userTenantId ? 'success' : 'error');
    log(`User Role: ${user?.role || 'NOT FOUND'}`, 'info');
    log(`Is Authenticated: ${parsed?.state?.isAuthenticated}`, 'info');
    log(`Full user object:`, 'info');
    log(JSON.stringify(user, null, 2), 'info');
} else {
    log('❌ NO AUTH STORAGE', 'error');
}

// Check setup wizard store
log('\n=== SETUP WIZARD STORE ===', 'info');
const setupStorage = localStorage.getItem('setup-wizard-storage');
if (setupStorage) {
    const parsed = JSON.parse(setupStorage);
    log(`Setup Complete: ${parsed?.state?.setupComplete}`, 'info');
    log(`Awaiting Activation: ${parsed?.state?.awaitingActivation}`, 'info');
    log(`Full state:`, 'info');
    log(JSON.stringify(parsed.state, null, 2), 'info');
} else {
    log('ℹ️  No setup wizard storage', 'warn');
}

// Summary
log('\n=== SUMMARY ===', 'info');
const finalTenantId = (tenantStorage && JSON.parse(tenantStorage)?.state?.tenant?.tenantId) ||
                      (authStorage && JSON.parse(authStorage)?.state?.user?.tenantId);
if (finalTenantId) {
    log(`✅ TENANT ID FOUND: ${finalTenantId}`, 'success');
    log(`\nMenu management should work with this tenant ID`, 'success');
} else {
    log(`❌ NO TENANT ID FOUND`, 'error');
    log(`\nPossible solutions:`, 'warn');
    log(`  1. Complete the tenant activation flow`, 'warn');
    log(`  2. Log in with a user account that has a tenant ID`, 'warn');
    log(`  3. Check the browser console for errors`, 'warn');
}
</script>
</body>
</html>
